# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
PackageIdentifier: sectapunterx.Tabless
PackageVersion: 0.10.0
InstallerType: inno
InstallModes:
  - interactive
  - silent
  - silentWithProgress
UpgradeBehavior: install
ReleaseDate: 2026-10-25
# installer/tabless.iss: AppId shared with lowkey and heap, so the ARP entry is the same program.
ProductCode: '{6F4C9E2A-3B7D-4E1F-9A6C-0D2B1E8F5A44}_is1'
Installers:
  # "All users" (Program Files) is the installer's default and asks for elevation itself.
  - Architecture: x64
    Scope: machine
    ElevationRequirement: elevatesSelf
    InstallerUrl: https://github.com/sectapunterx/tabless/releases/download/v0.10.0/tabless-v0.10.0-windows-setup.exe
    InstallerSha256: 54902F0412F03235ED6B8E7F7687BAE79FC10422420F8EB5B21954CB2D7A20BB
  # "Only for me": PrivilegesRequiredOverridesAllowed=commandline takes /CURRENTUSER, no elevation.
  - Architecture: x64
    Scope: user
    InstallerUrl: https://github.com/sectapunterx/tabless/releases/download/v0.10.0/tabless-v0.10.0-windows-setup.exe
    InstallerSha256: 54902F0412F03235ED6B8E7F7687BAE79FC10422420F8EB5B21954CB2D7A20BB
    InstallerSwitches:
      Custom: /CURRENTUSER
ManifestType: installer
ManifestVersion: 1.12.0
