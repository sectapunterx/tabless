name: CodeQL

# Static security analysis of the C++ (the QML is not covered by CodeQL).
# Findings land in the repository's Security tab. Not per PR, to keep PR CI
# fast: on every push to master, weekly for newly added queries, and on demand.
on:
  push:
    branches: [master]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (c-cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools + system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype-dev libdbus-1-3 libxcb1-dev

      - name: Install Qt6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.9.1"
          cache: true
          modules: qtnetworkauth

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
          # A TRAP cache is ~670 MB per master commit; a handful of them filled
          # the repository's 10 GB cache and evicted CI's ccache. The analysis
          # runs once per push to master, so it gains little from one.
          trap-caching: false

      # The app only: the analysis is about shipped code, and the tests would
      # double the build.
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHEAP_BUILD_TESTS=OFF
          cmake --build build --parallel --target heap

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:c-cpp"
