name: CI

on:
  push:
    branches: [master, feature]
  pull_request:
    branches: ["**"]
  # The full tier: release.yml runs it on every tag, nightly.yml on master
  # once a day. See `changes` for what the two tiers run.
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
      # What to check out; the triggering ref when empty. Nightly passes
      # `feature`: a schedule always runs on master, which only changes with
      # a release, so it would test what has already shipped.
      ref:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: true
      ref:
        type: string
        default: ""

permissions:
  # Read-only: no job pushes to the branch any more (formatting and tidy
  # report instead of committing fixes).
  contents: read
  # dorny/test-reporter posts a Check Run with the test results.
  checks: write
  # dorny/paths-filter lists a PR's files through the API.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/feature' }}

jobs:

  # ──────────────────────────────────────────────────────────────────
  # 0. Does this change need a build at all?
  # A PR that touches only docs/ or Markdown skips build, sanitizers and the
  # macOS package smoke test; `ci` counts a skipped job as passed. Pushes
  # (master, feature) always build everything. Not `paths-ignore` on the
  # trigger: then no `ci` check would report and the PR could not merge.
  # ──────────────────────────────────────────────────────────────────
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      # Two tiers. Every PR and push gets the fast one: everything on Windows,
      # Linux and macOS without the QML suite (the same QML, and it took
      # minutes there against Windows' two), and no sanitizer job. The full tier runs after a release is
      # tagged — release.yml publishes it as a pre-release and makes it the
      # update target only once this passes — and nightly on master.
      full: ${{ inputs.full == true }}
    steps:
      # On pull_request the filter reads the file list from the API — no
      # checkout needed.
      - name: Classify changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # `every`: a file counts as code only if it matches all patterns,
          # i.e. it is neither under docs/ nor Markdown.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  # ──────────────────────────────────────────────────────────────────
  # Branch flow: master is the stable line and only takes a release from
  # `feature` (where new work lands and is tested) or an urgent `hotfix/*`.
  # Any other PR into master fails here, and so fails `ci`.
  # ──────────────────────────────────────────────────────────────────
  branch-flow:
    name: branch flow
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Only feature or hotfix/* may target master
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            feature|hotfix/*) echo "branch flow OK: $HEAD_REF -> master" ;;
            *)
              echo "::error::PRs into master come from 'feature' (a release) or 'hotfix/*' — retarget '$HEAD_REF' to 'feature'"
              exit 1 ;;
          esac

  # ──────────────────────────────────────────────────────────────────
  # 1. clang-format on the changed lines (PR only).
  # Reports instead of committing: the old auto-fix bot pushed to PR branches,
  # which raced the author's own pushes and left the head commit needing
  # approval to run. Pinned to clang-format 18 so CI and the fix command in
  # the error agree; only the lines a PR changes are checked, so touching a
  # legacy file does not mean reformatting all of it.
  # ──────────────────────────────────────────────────────────────────
  format-cpp:
    name: clang-format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The PR's merge commit; HEAD^1 is the base it merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Check formatting of the changed lines
        run: |
          set -uo pipefail
          # Exits 1 when it has a diff to show; the case below decides.
          out=$(git-clang-format-18 --binary clang-format-18 --extensions cpp,h,mm --diff HEAD^1 2>&1) || true
          case "$out" in
            *"no modified files to format"*|*"did not modify any files"*|"")
              echo "formatting OK" ;;
            *)
              echo "$out"
              echo "::error::changed lines are not clang-formatted — run: git clang-format --binary clang-format-18 origin/master"
              exit 1 ;;
          esac

  # ──────────────────────────────────────────────────────────────────
  # 2. GitHub Actions YAML lint (full sweep — fast).
  # ──────────────────────────────────────────────────────────────────
  lint-actions:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          files: ".github/workflows/*.yml"

  # QML paints with the design tokens in qml/Theme.qml: no literal font
  # sizes, spacings or colours (see .github/scripts/ui_tokens_check.py), and
  # no hand-picked date pattern (date_format_check.py).
  ui-tokens:
    name: ui tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Check QML against the design tokens
        run: python3 .github/scripts/ui_tokens_check.py qml
      # Displayed dates go through the UI-language formatter (APP-188).
      - name: Check displayed dates against the locale formatter
        run: python3 .github/scripts/date_format_check.py qml src

  # ──────────────────────────────────────────────────────────────────
  # 5. Build + test matrix (Linux, Windows, macOS).
  # ──────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    steps:
      # Real-time scanning inspects every object file, header and DLL the build
      # touches. The runner is thrown away after the job, so skip the scan for
      # the checkout and for runner.temp, where setup-msys2 installs MSYS2.
      - name: Exclude build dirs from Defender (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}", "${{ runner.temp }}"

      # Depth 2: the qmllint ratchet judges findings on the lines this change
      # wrote, against HEAD^1 (the base of a PR's merge commit).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2

      # ccache hashes the compiler's command line, absolute paths included.
      # Renaming the repository (lowkey -> tabless) moved the checkout and
      # the Qt install, and every object missed: 13-minute builds on all
      # three runners. With the runner's work directory as base_dir the
      # paths are hashed relative to the build directory instead. A -g build
      # (ASan) hashes the working directory too; NOHASHDIR drops it (only the
      # debug info's compile dir can then be off, which CI never reads).
      - name: ccache base dir
        shell: bash
        run: |
          base=$(cd "$GITHUB_WORKSPACE/../.." && { pwd -W 2>/dev/null || pwd; })
          { echo "CCACHE_BASEDIR=$base"; echo "CCACHE_NOHASHDIR=true"; } >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$base"

      # Ubuntu 24.04's apt ships Qt 6.4.2, which has a static-QML-module
      # qmlcachegen bug: file-based .qml components ("SideRail is not a type")
      # don't resolve in a downstream Quick Test binary, forcing heap_qml_tests
      # to be skipped on Linux (HEAP-71). A newer Qt (matching the working local
      # 6.8/6.9) fixes it, so provision Qt via install-qt-action instead of apt.
      - name: Install build tools + system libs (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype-dev libdbus-1-3 libxcb1-dev

      - name: Install Qt6 (linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.9.1"
          cache: true
          modules: qtnetworkauth

      # Linux + macOS. Windows builds inside MSYS2 with MSYS2's own ccache, so
      # it only needs the cache directory carried between runs (below).
      #
      # Only branch runs (pushes to master/feature, nightly) save a ccache; a
      # PR restores its base branch's, a tag saves nothing (no one could read
      # it). Every PR saving its own pushed the repository past GitHub's 10 GB
      # cache limit, the oldest entries — master's and feature's among them —
      # were evicted, and the next build started cold: 20 minutes for Windows
      # instead of one. And only a ccache that missed enough is saved again
      # ("Save ccache" below); nightly prunes the older copies.
      - name: Setup ccache (linux, macos)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ runner.os }}-ccache
          save: false

      # Without this the MSYS2 ccache starts empty on every run and only adds
      # overhead. Unique key per run; restore-keys picks up the newest one
      # the run can see. Saved as on Linux and macOS (below).
      - name: Restore ccache (windows)
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-ccache-

      # Same update policy and Qt package set as release.yml's package-windows,
      # so CI tests the Qt that ships. qt6-svg and qtkeychain were missing here;
      # a release without Qt6Svg (v0.4.3) went unnoticed partly because of it.
      # Not `update: false` on PRs to save its ~1.5 min: without it the
      # packages come from setup-msys2's own MSYS2 snapshot, an older Qt and
      # GCC than ship, and every ccache entry missed (a 16-minute build).
      - name: Setup MSYS2 (windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qtkeychain
            mingw-w64-ucrt-x86_64-qt6-networkauth
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ccache

      # macOS: build the .app bundle + tests to validate the native bundle,
      # Objective-C++ Carbon hotkey backend, and tray-fallback notifications
      # (HEAP-68). Qt 6.8.1 to match Linux.
      - name: Install Qt6 (macos)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.9.1"
          cache: true
          modules: qtnetworkauth

      - name: Install ninja (macos)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (macos)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHEAP_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache

      - name: Build (macos)
        if: runner.os == 'macOS'
        run: |
          ccache -z
          cmake --build build --parallel --target heap heap_all_tests

      - name: Configure (linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHEAP_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (linux)
        if: runner.os == 'Linux'
        run: |
          ccache -z
          cmake --build build --parallel --target heap heap_all_tests

      - name: Configure (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHEAP_WARNINGS_AS_ERRORS=ON \
            -DMSYS_ROOT="$(cygpath -m "${{ steps.msys2.outputs.msys2-location }}")" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
        run: |
          ccache -z
          cmake --build build --parallel --target heap heap_all_tests
          ccache -s

      # How stale the restored ccache was: a copy that hit nearly everything
      # is not worth another few hundred MB of the 10 GB cache.
      - name: Count ccache misses
        id: ccache-misses
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            msys=$(cygpath -u '${{ steps.msys2.outputs.msys2-location }}')
            export PATH="$msys/ucrt64/bin:$PATH"
          fi
          misses=$(ccache --print-stats 2>/dev/null | awk -F'\t' '$1 == "cache_miss" { print $2 }')
          # Unreadable stats: save rather than let the cache go stale.
          echo "misses=${misses:-9999}" >> "$GITHUB_OUTPUT"
          echo "ccache misses: ${misses:-unknown}"

      - name: Save ccache
        if: >-
          ${{ github.event_name != 'pull_request' && github.ref_type == 'branch'
              && fromJSON(steps.ccache-misses.outputs.misses) > 30 }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          # The prefixes the restores above look for: hendrikmuhs/ccache-action
          # puts "ccache-" in front of its key.
          key: ${{ runner.os == 'Windows' && 'Windows-ccache' || format('ccache-{0}-ccache', runner.os) }}-${{ github.run_id }}

      # Tests run on the runner that built them. A separate test job meant a
      # tarred build tree up and down, a second Qt / MSYS2 install, and — via
      # `needs: build` on the whole matrix — Linux tests waiting for the macOS
      # build to finish.
      #
      # --parallel: every suite is its own process with its own test-mode data
      # dir (named after the executable, or the tst_*.qml file for the QML
      # suites, one test each), so they are safe to run side by side.
      # --timeout: a hung suite fails in minutes instead of eating the job.
      # ctest_with_retry.sh gives a failed suite one more try and reports it as
      # flaky if that passes; a suite that fails twice fails the job.
      - name: Run ctest (linux, macos)
        if: runner.os != 'Windows'
        shell: bash
        env:
          # The fast tier runs the QML suite on Windows only (see `changes`):
          # it was most of this job's time on Linux and macOS.
          SKIP_QML: ${{ needs.changes.outputs.full != 'true' }}
        run: |
          exclude=()
          if [[ $SKIP_QML == true ]]; then exclude=(-E heap_qml_tests); fi
          bash .github/scripts/ctest_with_retry.sh build/tests \
            "${exclude[@]}" \
            --parallel "$(getconf _NPROCESSORS_ONLN)" \
            --timeout 300 \
            --output-on-failure \
            --output-junit ctest-${{ matrix.os }}.xml

      # Windows: must run inside the msys2 shell so /ucrt64/bin (Qt6Core.dll
      # etc.) is on PATH — otherwise the test exe fails to launch with
      # STATUS_DLL_NOT_FOUND (0xc0000135).
      - name: Run ctest (windows)
        if: runner.os == 'Windows'
        # A suite that hangs past ctest's --timeout held the step for 30+ min,
        # and a cancelled job keeps no log; fail it instead.
        timeout-minutes: 15
        shell: msys2 {0}
        run: |
          bash .github/scripts/ctest_with_retry.sh build/tests \
            --parallel "$(getconf _NPROCESSORS_ONLN)" \
            --timeout 300 \
            --output-on-failure \
            --output-junit ctest-${{ matrix.os }}.xml

      # --smoke loads the whole UI and fails on any QML error, missing plugin or
      # image format. Here it checks the build tree; the Windows and macOS steps
      # below run it on the deployed bundle, which is what users get.
      # qmllint over the whole QML module, held to a per-file baseline: a file
      # may not gain findings on the lines a change wrote; those are annotated
      # in the PR (see .github/scripts/qmllint_ratchet.py).
      - name: qmllint ratchet (linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --target all_qmllint_json
          python3 .github/scripts/qmllint_ratchet.py build/heap_core_qmllint.json .github/qmllint-baseline.json --diff HEAD^1

      - name: Upload qmllint report (linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qmllint
          path: |
            build/heap_core_qmllint.json
            build/TodoCpp/heap_core.qmltypes
            .github/qmllint-baseline.json
          if-no-files-found: ignore

      - name: Smoke-test the app (linux)
        timeout-minutes: 5
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        # --perf-log: the startup timings (perf: lines) land in this log for
        # trend-watching; logged only, never judged (APP-161).
        run: build/tabless --smoke --perf-log --data-dir "$RUNNER_TEMP/smoke"

      # ──────────────────────────────────────────────────────────────────
      # clang-tidy on the changed lines (PR only), on this job's build tree.
      # Fails on any finding in a line the PR changed; the rest of a touched
      # file is left alone. readability-identifier-naming stays off: the
      # legacy code predates the naming rules and a changed line that merely
      # uses an old name would be flagged. Pinned to clang-tidy 18 (on the
      # runner image), the same as clang-format. It was a job of its own,
      # which spent three to six minutes generating the moc output this build
      # already has.
      # ──────────────────────────────────────────────────────────────────
      - name: Generate the remaining moc output (linux)
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        # The targets this job does not build (CLI, updater) need theirs too,
        # or clang-tidy cannot parse their sources.
        run: |
          ninja -C build -t targets all | sed -nE 's/^([A-Za-z0-9_]+_(autogen|qmltyperegistrations)):.*/\1/p' \
            | sort -u | xargs ninja -C build

      - name: clang-tidy on the changed lines (linux)
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        run: |
          set -uo pipefail
          if ! command -v clang-tidy-18 >/dev/null || ! command -v clang-tidy-diff-18.py >/dev/null; then
            sudo apt-get install -y --no-install-recommends clang-tidy-18
          fi
          # clang-tidy-diff exits non-zero on its own findings; the verdict is
          # taken from the log below, so the step must not stop here first.
          # Windows- and macOS-only sources (*_win.cpp, *.mm) are not in this
          # Linux compile database; tidy would only report their system
          # headers as missing, so they are left to their own platforms.
          git diff -U0 HEAD^1 -- '*.cpp' '*.h' \
            | clang-tidy-diff-18.py -p1 -path build -iregex '(?!.*_win\.cpp$).*\.cpp' \
                -clang-tidy-binary clang-tidy-18 -j "$(nproc)" -quiet \
                -checks='-readability-identifier-naming' -extra-arg=-Wno-error > tidy.log 2>&1 || true
          cat tidy.log
          if grep -qE ': (warning|error): ' tidy.log; then
            echo "::error::clang-tidy found issues in changed lines (above)"
            exit 1
          fi

      # The portable bundle exactly as release.yml assembles it (windeployqt +
      # copy-deps + UCRT), started with a PATH that has no MSYS2 on it — so a DLL
      # or plugin the bundle forgot fails here instead of on a user's machine.
      - name: Assemble portable bundle (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eu
          export PATH="/ucrt64/bin:/ucrt64/share/qt6/libexec:/ucrt64/share/qt6/bin:$PATH"
          cmake --build build --target portable

      - name: Smoke-test the portable bundle (windows)
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $dataDir = Join-Path $env:RUNNER_TEMP 'smoke'
          # tabless.exe is a GUI-subsystem binary with no console of its own: the
          # verdict goes to the redirected stderr, and the run's whole log is
          # kept as <data-dir>\logs\smoke.log (the run itself uses a temp dir).
          $err = Join-Path $env:RUNNER_TEMP 'smoke-stderr.txt'
          $p = Start-Process -FilePath build\heap-portable\tabless.exe `
                 -ArgumentList '--smoke', '--data-dir', $dataDir `
                 -RedirectStandardError $err -Wait -PassThru
          Get-Content $err -ErrorAction SilentlyContinue
          Get-Content (Join-Path $dataDir 'logs\smoke.log') -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "smoke failed with exit code $($p.ExitCode)"; exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          # qml-results/: the QML cases as they ran (stdout is lost on Windows).
          path: |
            build/tests/ctest-${{ matrix.os }}.xml
            build/tests/qml-results/

      - name: Render test report
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: tests (${{ matrix.os }})
          path: build/tests/ctest-${{ matrix.os }}.xml
          reporter: java-junit
          fail-on-error: false

      # macOS packaging smoke-test, on the bundle this job already built.
      # Exercises the release `.dmg` assembly with ad-hoc signing (no secrets),
      # so a change that re-breaks the bundle signature or the dmg layout fails
      # HERE — via `codesign --verify` — instead of shipping a "damaged" artifact
      # from release.yml's package-macos, which this mirrors (arm64, deployment
      # target 12.0, macdeployqt relocation guard, ad-hoc sign, drag-install dmg).
      # It used to be its own job: a second macOS runner, Qt install and build.
      - name: Deploy + ad-hoc sign + assemble dmg (macos)
        if: runner.os == 'macOS'
        run: |
          set -eu
          macdeployqt build/Tabless.app -qmldir="$PWD/qml"
          test -d build/Tabless.app/Contents/Frameworks/QtCore.framework
          if otool -L build/Tabless.app/Contents/MacOS/Tabless | grep -Eiq '/Users/runner/work/.*Qt|/aqt'; then
            echo "::error::macdeployqt left absolute Qt paths — relocation failed"
            exit 1
          fi
          # The re-sign + verify that the original workflow was missing: an
          # invalidated signature (the "damaged" bug) fails this verify.
          codesign --force --deep --sign - build/Tabless.app
          codesign --verify --deep --strict --verbose=2 build/Tabless.app
          bash packaging/macos/make-dmg.sh build/Tabless.app smoke.dmg

      - name: Verify dmg mounts with the app + Applications target (macos)
        if: runner.os == 'macOS'
        run: |
          set -eu
          hdiutil attach smoke.dmg -nobrowse -mountpoint /Volumes/Tabless
          test -d /Volumes/Tabless/Tabless.app
          test -L /Volumes/Tabless/Applications
          # A busy volume ("Resource busy") is a runner hiccup, not a bad dmg.
          for _ in 1 2 3 4 5; do
            hdiutil detach /Volumes/Tabless && break
            sleep 3
          done
          if hdiutil info | grep -q /Volumes/Tabless; then
            hdiutil detach -force /Volumes/Tabless || true
          fi

      - name: Smoke-test the deployed app (macos)
        timeout-minutes: 5
        if: runner.os == 'macOS'
        run: build/Tabless.app/Contents/MacOS/Tabless --smoke --data-dir "$RUNNER_TEMP/smoke"

  # ──────────────────────────────────────────────────────────────────
  # 7. ASan + UBSan run (Linux only).
  # ──────────────────────────────────────────────────────────────────
  sanitizers:
    name: ASan + UBSan
    needs: changes
    # Full tier only (see `changes`).
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    # The instrumented Debug build alone takes ~23 minutes on a hosted runner,
    # so a 25-minute cap cancelled the job before a single test ran — on
    # master too. The tests themselves take a couple of minutes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Install build tools + system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype-dev libdbus-1-3 libxcb1-dev

      # Qt via install-qt-action (6.8.1) — apt's 6.4.2 can't run heap_qml_tests
      # (HEAP-71); its own QML modules ship with the install.
      - name: Install Qt6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.9.1"
          cache: true
          modules: qtnetworkauth

      # ccache hashes the compiler's command line, absolute paths included.
      # Renaming the repository (lowkey -> tabless) moved the checkout and
      # the Qt install, and every object missed: 13-minute builds on all
      # three runners. With the runner's work directory as base_dir the
      # paths are hashed relative to the build directory instead. A -g build
      # (ASan) hashes the working directory too; NOHASHDIR drops it (only the
      # debug info's compile dir can then be off, which CI never reads).
      - name: ccache base dir
        shell: bash
        run: |
          base=$(cd "$GITHUB_WORKSPACE/../.." && { pwd -W 2>/dev/null || pwd; })
          { echo "CCACHE_BASEDIR=$base"; echo "CCACHE_NOHASHDIR=true"; } >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$base"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ runner.os }}-asan-ccache
          # -g + sanitizer objects are several times larger than Release ones.
          max-size: 1G
          # Branch runs only, see the build job.
          save: ${{ github.event_name != 'pull_request' && github.ref_type == 'branch' }}

      - name: Configure with sanitizers
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHEAP_WARNINGS_AS_ERRORS=ON \
            -DHEAP_ENABLE_SANITIZERS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build tests
        run: |
          cmake --build build-san --parallel --target heap_qml_tests

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          # heap_selection_tests instantiates AppController under offscreen
          # QPA. AppController owns a NotificationCenter (tray fallback) and
          # a GitWatcher that touch global Qt singletons whose teardown order
          # is undefined at process exit — leak detector flags those as
          # one-shot "still reachable" allocations. They are not real leaks;
          # mute LSan for the sanitizer job so the run stays meaningful.
          LSAN_OPTIONS: detect_leaks=0
          QT_QPA_PLATFORM: offscreen
        run: |
          # Sanitized suites run several times slower, hence the longer limit.
          # The QML suite is left out: under the sanitizers it ran past 75 min
          # on its own (0.8.1). It runs unsanitized in every build job.
          # TEMP (hotfix/0.10-full-ci): the QML crash suites under ASan.
          ctest --test-dir build-san/tests --parallel 4 --timeout 900 --output-on-failure \
            -R 'heap_qml_tests[.](KeymapSchemes|ShellLayout|MouseNav|ZoomKeys|PanelKeys)$' || true
          exit 1

  # ──────────────────────────────────────────────────────────────────
  # 8. Aggregator — single required status check for branch protection.
  #
  # Branch-protection rules in GitHub require each contributing job to be
  # listed explicitly; adding a new job means editing the rule every time.
  # This `ci` job depends on every real job in the workflow and reports its
  # combined result. Add only `ci` to "Required status checks" on master and
  # any new job is automatically covered as soon as it is added to `needs:`
  # below.
  #
  # `if: always()` ensures this job runs even when a dependency fails or is
  # skipped (PR-only jobs like format-cpp are skipped on push). The
  # gating logic treats `skipped` and `success` as OK and only fails on
  # `failure` or `cancelled` — so the check is green on push (where the
  # PR-only jobs don't run) and on PRs alike.
  # ──────────────────────────────────────────────────────────────────
  ci:
    name: ci
    if: always()
    needs:
      - changes
      - branch-flow
      - lint-actions
      - ui-tokens
      - format-cpp
      - build
      - sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check dependency results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          echo "Dependency results:"
          echo "$NEEDS_JSON"
          if echo "$NEEDS_JSON" | grep -E '"result": *"(failure|cancelled)"' >/dev/null; then
            echo "::error::At least one required job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs succeeded or were skipped."
